[package]
name = "ticket_secrets"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ticket_secrets"
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
hmac = "0.12"
pyo3 = "0.28.3"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
